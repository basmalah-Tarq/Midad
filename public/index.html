<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مِداد | المكتبة الإلكترونية</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script>
      // Pick the visitor's language: English browsers go to /en/, everyone else to /ar/.
      var lang = (navigator.language || "").toLowerCase().indexOf("en") === 0 ? "en" : "ar";
      location.replace("/" + lang + "/" + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/ar/" /></noscript>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f2a24; color: #f1ebe0; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <a href="/ar/" style="color:#e2b65f">مِداد ← ادخل المكتبة</a>
  </body>
</html>
